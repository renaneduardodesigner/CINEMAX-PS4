name: Validate and deploy CINEMAX
on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check service-worker.js
      - name: Check manifest JSON
        run: python -c "import json; json.load(open('manifest.webmanifest', encoding='utf-8'))"
      - name: Check HTML and local assets
        run: python scripts/check-integrity.py
      - name: Check required app files
        run: |
          test -s index.html
          test -s assets/styles.css
          test -s assets/app.js
          test -s manifest.webmanifest
          test -s service-worker.js
          grep -q 'assets/app.js' index.html
          grep -q 'assets/styles.css' index.html
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
