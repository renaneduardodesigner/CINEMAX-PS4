name: Deploy CINEMAX to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate application files
        run: |
          set -eu
          test -s index.html
          test -s assets/app.js
          test -s assets/styles.css
          test -s assets/icon.svg
          test -s manifest.webmanifest
          test -s service-worker.js
          node --check assets/app.js
          node --check service-worker.js
          python -c "import json; json.load(open('manifest.webmanifest', encoding='utf-8'))"

      - name: Prepare clean Pages site
        run: |
          set -eu
          rm -rf _site
          mkdir -p _site/assets
          cp index.html manifest.webmanifest service-worker.js .nojekyll _site/
          cp assets/app.js assets/styles.css assets/icon.svg _site/assets/
          test -s _site/index.html
          test -s _site/assets/app.js
          test -s _site/assets/styles.css

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
