name: Build CINEMAX PS4 FPKG

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinemax-ps4-fpkg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fpkg:
    name: Build native PS4 FPKG
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Generate and validate package icon
        shell: bash
        run: |
          set -euo pipefail
          cd ps4-native
          python3 scripts/create_icon.py
          python3 - <<PY
          import pathlib, struct
          p = pathlib.Path("sce_sys/icon0.png")
          data = p.read_bytes()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("icon0.png is not a PNG")
          width, height, depth, color = struct.unpack(">IIBB", data[16:26])
          if (width, height, depth, color) != (512, 512, 8, 2):
              raise SystemExit(f"icon0.png must be 512x512, 8-bit RGB; got {width}x{height}, depth={depth}, color={color}")
          print(f"Icon OK: {width}x{height}, 24-bit RGB")
          PY

      - name: Build with official OpenOrbis Toolchain container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/ps4-native \
            openorbisofficial/toolchain:v0.5.1 \
            sh -lc '
              set -eu
              : "${OO_PS4_TOOLCHAIN:?OO_PS4_TOOLCHAIN is not set in the OpenOrbis container}"
              test -x "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"
              test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-eboot"
              command -v clang++
              command -v ld.lld
              make clean
              if ! make; then
                echo "Build failed; inspecting generated package files"
                ls -lah .
                if test -s IV0000-CMAX00001_00-CINEMAXPS4APP000.pkg; then
                  file IV0000-CMAX00001_00-CINEMAXPS4APP000.pkg || true
                  od -An -tx1 -N16 IV0000-CMAX00001_00-CINEMAXPS4APP000.pkg || true
                  "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_validate IV0000-CMAX00001_00-CINEMAXPS4APP000.pkg || true
                fi
                exit 1
              fi
              test -s eboot.bin
              test -s sce_sys/param.sfo
              test -s sce_sys/icon0.png
              test -s IV0000-CMAX00001_00-CINEMAXPS4APP000.pkg
              pkg=IV0000-CMAX00001_00-CINEMAXPS4APP000.pkg
              magic=$(od -An -tx1 -N4 "$pkg" | tr -d "[:space:]")
              test "$magic" = "7f434e54"
              eboot_magic=$(od -An -tx1 -N4 eboot.bin | tr -d "[:space:]")
              test "$eboot_magic" = "4f153d1d"
              "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_validate "$pkg"
              echo "SELF and PKG integrity checks passed; bytes: $(wc -c < "$pkg")"
            '

      - name: Publish FPKG artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: CINEMAX-PS4-FPKG
          path: ps4-native/IV0000-CMAX00001_00-CINEMAXPS4APP000.pkg
          if-no-files-found: error
          retention-days: 30
