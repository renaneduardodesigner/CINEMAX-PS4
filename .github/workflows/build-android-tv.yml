name: Build CINEMAX Android TV APK
on:
  push:
    branches: ["release/**", main]
    paths: ["android-tv/**", ".github/workflows/build-android-tv.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinemax-android-tv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: test -s android-tv/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CINEMAX-ANDROID-TV-APK
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
